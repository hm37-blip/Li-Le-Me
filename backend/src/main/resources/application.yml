server:
  port: 8080

spring:
 datasource:
    url: ${MYSQL_URL:jdbc:mysql://10.20.110.8:3306/mysql?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:IYspc3VWOh5uF9QjTgkS}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
  jackson:
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 开发/生产硬开关。dev-mode=true 放开 /debug/*、/api/admin/*、mock 登录（本地默认）。
# 生产部署：APP_DEV_MODE=false 且 ADMIN_TOKEN=<强随机值>（重启生效）。
app:
  dev-mode: ${APP_DEV_MODE:true}
  admin-token: ${ADMIN_TOKEN:}

wechat:
  appid: ${WECHAT_APPID:your_appid}
  secret: ${WECHAT_SECRET:your_secret}
  mock-openid: "dev_user_001"

auth:
  jwt-secret: ${JWT_SECRET:li-le-me-dev-secret-change-me}
  access-token-expires-in: ${JWT_ACCESS_TOKEN_EXPIRES_IN:7200}
  refresh-token-expires-in: ${JWT_REFRESH_TOKEN_EXPIRES_IN:2592000}

logging:
  level:
    com.lilema: DEBUG
