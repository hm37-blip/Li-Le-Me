server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:file:./data/lileme;MODE=MySQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

wechat:
  appid: your_appid
  secret: your_secret
  mock-openid: "dev_user_001"

logging:
  level:
    com.lilema: DEBUG
